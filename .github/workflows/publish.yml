name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Same dependency note as CI: `@kepler.gl/mcp` must be resolvable before
      # install (and, for consumers, published to npm) — the `file:` line in
      # package.json is the deferred step.
      - run: pnpm install --frozen-lockfile

      # `pnpm publish` runs the `prepublishOnly` script (`pnpm build`), so dist/ is
      # built fresh and shipped via the `files` field.
      - run: pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
