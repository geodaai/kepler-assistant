name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Same dependency note as CI: `@kepler.gl/mcp` must be resolvable before
      # install (and, for consumers, published to npm) — the `file:` line in
      # package.json is the deferred step.
      - run: pnpm install --frozen-lockfile

      # `pnpm publish` runs the `prepublishOnly` script (`pnpm build`), and the
      # build's generate-skills.mjs bundles the geoda-analysis skill sourced from
      # the geoda-lib repo. Fetch the two skill files (skill.yaml + SKILL.md) here,
      # since GEODA_SKILL_DIR defaults to a machine-local path (see ci.yml).
      - name: Fetch geoda-analysis skill from geoda-lib
        env:
          GEODA_REPO_REF: main
        run: |
          mkdir -p /tmp/geoda-skill
          for f in SKILL.md skill.yaml; do
            curl -fsSL -o "/tmp/geoda-skill/$f" \
              "https://raw.githubusercontent.com/geodaai/geodalib/${GEODA_REPO_REF}/skills/geoda-analysis/$f"
          done
          echo "GEODA_SKILL_DIR=/tmp/geoda-skill" >> "$GITHUB_ENV"

      # `pnpm publish` runs the `prepublishOnly` script (`pnpm build`), so dist/ is
      # built fresh and shipped via the `files` field.
      #
      # --no-git-checks: a tag-triggered run checks out at the tag (detached HEAD,
      # not on main), which trips pnpm's default branch check (ERR_PNPM_GIT_UNKNOWN_BRANCH).
      # CI publishes a fixed commit with a clean tree, so the git checks add nothing
      # here — auth, version-exists, and build checks still run.
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
